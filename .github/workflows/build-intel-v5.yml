name: Build macOS DMG

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-13
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@main

      - name: Set up Python
        uses: actions/setup-python@main
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywebview customtkinter numpy mss pytesseract pynput requests opencv-python pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller \
            --onedir \
            --windowed \
            --icon="icon.icns" \
            --strip \
            --target-architecture=x86_64 \
            "SolarFishingV5.py"

      - name: Check dist contents
        run: |
          ls -lh dist
          echo "Contents of dist:"
          ls -la dist/
          ls -la dist/SolarFishingV5

      - name: Create DMG from .app bundle
        run: |
          APP_PATH=$(find dist -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"

          hdiutil create \
            -volname "SolarFishingV5" \
            -srcfolder "$APP_PATH" \
            -ov \
            -format UDZO \
            SolarFishingV5.dmg

          echo "DMG created:"
          ls -lh SolarFishingV5.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolarFishingV5-macOS-Intel
          path: SolarFishingV5.dmg