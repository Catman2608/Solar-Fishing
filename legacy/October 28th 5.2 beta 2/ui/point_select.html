<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        width: 100%;
        height: 100%;
        position: fixed;
        inset: 0;
        overflow: hidden;
        user-select: none;
        background: #000;
    }
    canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
    }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
window.addEventListener("pywebviewready", () => {
    try {
        pywebview.api.window_ready(window.screenX, window.screenY, window.innerWidth, window.innerHeight);
    } catch (e) {}
    loadScreenshot();
    loadGeometry();
});

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let mouseX = 0;
let mouseY = 0;
let ratioX = 0;
let ratioY = 0;
let screenshotImg = null;
let screenshotReady = false;
let geo = { menu_offset: 0, screen_w: 1, screen_h: 1 };

function resize() {
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(1, window.innerWidth || 1);
    const h = Math.max(1, window.innerHeight || 1);
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
}
window.addEventListener("resize", resize);
resize();

function loadScreenshot() {
    if (!window.pywebview || !pywebview.api || !pywebview.api.get_screenshot_data) return;
    pywebview.api.get_screenshot_data().then(dataUrl => {
        if (!dataUrl) {
            screenshotReady = false;
            draw();
            return;
        }
        const img = new Image();
        img.onload = () => {
            screenshotImg = img;
            screenshotReady = true;
            draw();
        };
        img.onerror = () => {
            screenshotReady = false;
            draw();
        };
        img.src = dataUrl;
    }).catch(() => {
        screenshotReady = false;
        draw();
    });
}

function loadGeometry() {
    if (!window.pywebview || !pywebview.api || !pywebview.api.get_geometry) return;
    pywebview.api.get_geometry().then(g => {
        if (g && typeof g === "object") {
            geo.menu_offset = Number(g.menu_offset) || 0;
            geo.screen_w = Math.max(1, Number(g.screen_w) || 1);
            geo.screen_h = Math.max(1, Number(g.screen_h) || 1);
        }
        updateRatio();
        draw();
    }).catch(() => {});
}

// Called from Python after window_ready as a secondary trigger
window.__applyScreenshot = function () {
    loadScreenshot();
};

function updateRatio() {
    // Use the actual overlay viewport so the ratio always matches what
    // the user sees, independent of DPI / logical-vs-physical mismatch.
    const w = Math.max(1, window.innerWidth || canvas.clientWidth || 1);
    const h = Math.max(1, window.innerHeight || canvas.clientHeight || 1);
    ratioX = Math.max(0, Math.min(1, mouseX / w));
    ratioY = Math.max(0, Math.min(1, mouseY / h));
}

function formatRatio(v) {
    return v.toFixed(3);
}

function draw() {
    const w = window.innerWidth || canvas.width || 1;
    const h = window.innerHeight || canvas.height || 1;
    ctx.clearRect(0, 0, w, h);

    // 1) Frozen screenshot (menu-bar already cropped on the Python side)
    if (screenshotReady && screenshotImg) {
        ctx.drawImage(screenshotImg, 0, 0, w, h);
    } else {
        ctx.fillStyle = "#1a1a1a";
        ctx.fillRect(0, 0, w, h);
    }

    // 2) Very light dim so the crosshair / preview stand out
    ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
    ctx.fillRect(0, 0, w, h);

    const mx = mouseX;
    const my = mouseY;

    // Crosshair ring
    ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(mx, my, 18, 0, Math.PI * 2);
    ctx.stroke();

    // Crosshair lines
    ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(mx - 28, my);
    ctx.lineTo(mx + 28, my);
    ctx.moveTo(mx, my - 28);
    ctx.lineTo(mx, my + 28);
    ctx.stroke();

    // Ratio label box
    const label = formatRatio(ratioX) + ", " + formatRatio(ratioY);
    const boxW = 110;
    const boxH = 28;
    const gap = 26;

    let boxX = mx - boxW / 2;
    let boxY;
    if (my > h * 0.5) {
        boxY = my - gap - boxH;
    } else {
        boxY = my + gap;
    }

    // Clamp so the preview stays on-screen
    boxX = Math.max(4, Math.min(boxX, w - boxW - 4));
    boxY = Math.max(4, Math.min(boxY, h - boxH - 4));

    // Shadow
    ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
    ctx.fillRect(boxX + 2, boxY + 2, boxW, boxH);

    // Background
    ctx.fillStyle = "rgba(20, 20, 20, 0.92)";
    ctx.fillRect(boxX, boxY, boxW, boxH);
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.strokeRect(boxX, boxY, boxW, boxH);

    // Label
    ctx.fillStyle = "#ffffff";
    ctx.font = "13px monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(label, boxX + boxW / 2, boxY + boxH / 2);
}

canvas.addEventListener("mousemove", e => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    updateRatio();
    draw();
});

canvas.addEventListener("click", e => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    updateRatio();
    try {
        // Send the already-normalized ratios (0–1 of the visible overlay).
        pywebview.api.pick_point(ratioX, ratioY);
    } catch (err) {}
});

document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
        try {
            pywebview.api.close_point_select();
        } catch (err) {}
    }
});
</script>
</body>
</html>
